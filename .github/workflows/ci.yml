name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows desktop sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build
        # Only the Windows target is built here: Android and iOS need their own
        # workloads (and a macOS runner for iOS).
        run: >
          dotnet build examples/WindowsDesktop/BarcodeQrScanner.csproj
          -c Release
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

  ios:
    name: Build iOS sample (${{ matrix.project }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        project:
          - examples/BarcodeQrScanner/BarcodeQrScanner.csproj
          - examples/MrzScanner/MRZScanner.csproj
          - examples/DocumentScanner/AutoNormalize.csproj
          - examples/VINScanner/VINScanner.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Build for the iOS simulator
        # Restore only the iOS target: the projects also list the Android TFM,
        # and pulling the Android workload into every matrix leg is unnecessary.
        run: >
          dotnet build ${{ matrix.project }}
          -c Release
          -f net10.0-ios26.0
          -p:TargetFrameworks=net10.0-ios26.0
          -p:RuntimeIdentifier=iossimulator-arm64

