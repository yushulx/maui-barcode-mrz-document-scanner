name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows desktop sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build
        # Only the Windows target is built here: Android and iOS need their own
        # workloads (and a macOS runner for iOS).
        run: >
          dotnet build examples/WindowsDesktop/BarcodeQrScanner.csproj
          -c Release
          -p:TargetFrameworks=net10.0-windows10.0.19041.0

  ios:
    name: Build iOS sample (${{ matrix.project }})
    runs-on: macos-15
    env:
      # The .NET iOS 26.0 workload requires Xcode 26, not the runner's default 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        project:
          - examples/BarcodeQrScanner/BarcodeQrScanner.csproj
          - examples/MrzScanner/MRZScanner.csproj
          - examples/DocumentScanner/AutoNormalize.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      - name: Build for the iOS simulator
        # Restore only the iOS target: the projects also list the Android TFM,
        # and pulling the Android workload into every matrix leg is unnecessary.
        # Errors are re-emitted as check annotations so they are readable
        # without repository admin rights.
        shell: bash
        run: |
          set +e
          dotnet build "${{ matrix.project }}" \
            -c Release \
            -f net10.0-ios26.0 \
            -p:TargetFrameworks=net10.0-ios26.0 \
            -p:RuntimeIdentifier=iossimulator-arm64 > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "error [A-Z]+[0-9]+|error :|error CS|error MSB|error NETSDK|error NU" build.log \
              | sort -u | head -10 | while IFS= read -r line; do
                echo "::error title=build failure::${line//'%'/'%25'}"
              done
            echo "---------- last 40 lines ----------"
            tail -40 build.log
          fi
          exit $status

